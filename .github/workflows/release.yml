name: Build and release Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish milestone
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the milestone
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check milestone and version
        id: milestone
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Run this workflow on main, not a development branch.'
          }
          $current = gh api "repos/$env:GH_REPO/git/ref/heads/main" --jq .object.sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine the latest main commit.' }
          if ($current -ne $env:GITHUB_SHA) { throw 'A newer milestone is on main; this run will not publish an older release.' }
          $version = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw 'Expected a numeric application version in Directory.Build.props.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version-build.$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT

      - name: Run project checks
        shell: pwsh
        run: |
          dotnet run --project tests/ChudPresence.Link.Checks -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Core and API checks failed.' }
          dotnet run --project tests/ChudPresence.Link.Windows.Checks -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Windows checks failed.' }
          node --test tests/link-client.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript client checks failed.' }

      - name: Build x64 and ARM64 packages
        shell: pwsh
        run: |
          ./scripts/Build-Installer.ps1 -Runtime win-x64
          ./scripts/Build-Installer.ps1 -Runtime win-arm64

      - name: Publish GitHub Release
        shell: pwsh
        env:
          VERSION: ${{ steps.milestone.outputs.version }}
          TAG: ${{ steps.milestone.outputs.tag }}
        run: |
          $current = gh api "repos/$env:GH_REPO/git/ref/heads/main" --jq .object.sha
          if ($LASTEXITCODE -ne 0 -or $current -ne $env:GITHUB_SHA) { throw 'Main changed during the build; refusing to publish an older release.' }
          $files = @(
            "dist/ChudPresence-Link-$env:VERSION-win-x64-Setup.exe",
            'dist/ChudPresence-Link-win-x64.zip',
            "dist/ChudPresence-Link-$env:VERSION-win-x64-SHA256SUMS.txt",
            "dist/ChudPresence-Link-$env:VERSION-win-arm64-Setup.exe",
            'dist/ChudPresence-Link-win-arm64.zip',
            "dist/ChudPresence-Link-$env:VERSION-win-arm64-SHA256SUMS.txt"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release asset: $file" }
          }
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          gh release create $env:TAG @files --target $env:GITHUB_SHA --title "ChudPresence Link $env:VERSION ($shortSha)" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release. If it already exists, inspect it before retrying.' }
